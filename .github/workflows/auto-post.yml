name: Auto-publish story (manual fallback)

# Primary scheduling is Vercel Cron (vercel.json → /api/cron/daily-post), which
# runs on the deployment itself. This workflow is a manual fallback: trigger it
# from the Actions tab ("Run workflow") if a Vercel run is missed. Sharing (social
# posts, the owner's email, YouTube) is done by kidstory-api's social agent, so
# only the API and Supabase secrets are needed here.
on:
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run auto-post
        env:
          KIDSTORY_API_URL: ${{ secrets.KIDSTORY_API_URL }}
          KIDSTORY_API_KEY: ${{ secrets.KIDSTORY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
